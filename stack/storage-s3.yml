# Optional storage backend: the file bytes live in an S3-compatible bucket (here Hetzner Object
# Storage) instead of the local volume. Everything else stays as it is — the Storage API in front
# still checks tokens and policies, keeps the metadata in storage.objects and signs URLs, so the
# CMS, the MCP tools and every per-role right work unchanged.
#
# On:  STORAGE_BACKEND=s3 in .env (scripts/lib.sh then adds this file), plus
#      S3_BACKEND_HOST (e.g. hel1.your-objectstorage.com), S3_BACKEND_REGION (e.g. hel1),
#      S3_BACKEND_BUCKET, S3_BACKEND_KEY_ID, S3_BACKEND_SECRET.
# Off: remove STORAGE_BACKEND (or set it to file) and recreate the storage container.
# Switching does not move existing files; docs/storage-s3.md.
services:
  storage:
    environment:
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: ${S3_BACKEND_BUCKET}
      STORAGE_S3_ENDPOINT: https://${S3_BACKEND_HOST}
      STORAGE_S3_REGION: ${S3_BACKEND_REGION}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_BACKEND_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_BACKEND_SECRET}
